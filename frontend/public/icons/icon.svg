<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle / Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#darkBg)" stroke="url(#gold)" stroke-width="12"/>

  <!-- Outer Ring with Dashes (Casino Chip effect) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#gold)" stroke-width="8" stroke-dasharray="24 16" opacity="0.6"/>

  <!-- Inner Gold Circle -->
  <circle cx="256" cy="256" r="150" fill="#111827" stroke="url(#gold)" stroke-width="10" filter="url(#glow)"/>

  <!-- Slot Machine / Crown Icon -->
  <g transform="translate(136, 136)">
    <!-- Crown / Bet Symbol -->
    <path d="M40 180 L200 180 L180 80 L140 130 L120 40 L100 130 L60 80 Z" fill="url(#gold)" filter="url(#glow)"/>
    <circle cx="120" cy="30" r="12" fill="#FEF08A"/>
    <circle cx="60" cy="70" r="10" fill="#FEF08A"/>
    <circle cx="180" cy="70" r="10" fill="#FEF08A"/>
    <!-- Letters BET -->
    <text x="120" y="215" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="url(#gold)" text-anchor="middle" letter-spacing="4">SITEBET</text>
  </g>
</svg>
